# Mantem a API acordada no plano gratuito da Render.
#
# A Render desliga o servico depois de 15 minutos sem receber requisicao, e o
# primeiro acesso seguinte demora uns 50 segundos para religar — o cliente da
# Nane abriria o cardapio e veria o esqueleto carregando. Este workflow chama
# o /health de tempos em tempos para isso nao acontecer.
#
# De brinde, o /health conta registros no banco, e isso tambem impede o
# Supabase gratuito de pausar o projeto por inatividade (7 dias).
#
# O endereco padrao e o da Render. Se um dia mudar, crie a variavel API_URL no
# repositorio (Settings > Secrets and variables > Actions > Variables), sem
# barra no final — ela passa na frente do padrao.
#
# ATENCAO: o GitHub desliga workflows agendados depois de 60 dias sem commit
# no repositorio publico, e avisa por e-mail. Para religar: aba Actions >
# "Manter a API acordada" > Enable workflow.

name: Manter a API acordada

on:
  schedule:
    # A cada 10 minutos, e nao 14: o agendador do GitHub atrasa as execucoes
    # (as vezes varios minutos), e com 14 um atraso passaria dos 15 da Render.
    - cron: '*/10 * * * *'
  # Botao "Run workflow" na aba Actions, para testar na hora.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o /health
        env:
          API_URL: ${{ vars.API_URL || 'https://api-pointdanane.onrender.com' }}
        run: |
          # --max-time 90 cobre o religamento de ~50s se a API ja tiver dormido;
          # --retry tenta de novo se a Render responder erro enquanto acorda.
          resposta=$(curl --silent --show-error --fail \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "$API_URL/health")

          echo "$resposta"

          # A API pode estar no ar com o banco fora; isso tambem e falha.
          echo "$resposta" | grep -q '"banco":"ok"'
